<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>站点管理｜徐俊</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=20260824-1">
</head>
<body class="admin-body">
  <main class="admin-shell">
    <header class="admin-header">
      <div><p class="eyebrow">Private dashboard</p><h1>访问与留言</h1><p>徐俊个人学术主页 · 北京时间（UTC+8）</p></div>
      <a class="button button-secondary" href="index.html">返回主页</a>
    </header>

    <section class="admin-card login-card" id="login-panel">
      <h2>验证管理密码</h2>
      <p>密码仅发送给服务端验证。</p>
      <form id="login-form">
        <label for="admin-password">管理密码</label>
        <input id="admin-password" name="password" type="password" autocomplete="current-password" required>
        <button class="button button-primary" type="submit">进入后台</button>
        <p class="form-status" id="login-status" role="status"></p>
      </form>
    </section>

    <section id="dashboard" hidden>
      <div class="admin-section"><button class="button button-secondary" id="logout" type="button">退出登录</button></div>
      <div class="metric-grid" id="metric-grid"></div>
      <section class="admin-section"><h2>访客汇总</h2><div class="table-wrap"><table><thead><tr><th>IP</th><th>大致地区</th><th>访问次数</th><th>首次访问</th><th>最近访问</th></tr></thead><tbody id="visitor-rows"></tbody></table></div></section>
      <section class="admin-section"><h2>匿名留言</h2><div id="admin-messages"></div></section>
      <section class="admin-section"><h2>最近访问</h2><div class="table-wrap"><table><thead><tr><th>时间</th><th>IP</th><th>地区</th><th>页面</th><th>来源</th></tr></thead><tbody id="visit-rows"></tbody></table></div></section>
    </section>
  </main>
  <script src="config.js?v=20260824-1"></script>
  <script src="admin.js?v=20260824-1" defer></script>
</body>
</html>
